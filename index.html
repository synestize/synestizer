<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <title>synestizer</title>

  <link rel="stylesheet" href="./css/normalize.css">
  <link rel="stylesheet" href="./css/font-awesome.min.css">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    //Make sure SSL or it will silently break
    if (
      !(
        window.location.host.startsWith("127.0.0.1") || window.location.host.startsWith("localhost")
      ) && (window.location.protocol != "https:")
    ) {
      window.location.protocol = "https";
    }
  </script>
</head>

<body>
  <!-- Synestizer app React mount point -->
  <main id="synapp">
  </main>
  <!-- Video analysis DOM React mount point -->
  <section id="video-io">
      <canvas id="video-canvas" ></canvas>
      <video id="video-video" muted autoplay></video>
  </section>
  <!-- Synestizer app JS -->
  <script src="bundle.js"></script>
<!-- Matomo Analytics -->
<script>
  var _paq = window._paq = window._paq || [];
  /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  (function() {
    var u="//kasparkoenig.com/analytics/";
    _paq.push(['setTrackerUrl', u+'matomo.php']);
    _paq.push(['setSiteId', '4']);
    var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
    g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
  })();
</script>
<!-- End Matomo Code -->

</body>
</html>
